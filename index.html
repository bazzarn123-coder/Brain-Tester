<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Brain Tester: 1000 Puzzles (Fixed)</title>
    <!-- Browser Tab Favicon -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧠</text></svg>">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --card-border: #334155;
            --accent-primary: #6366f1;
            --accent-success: #10b981;
            --accent-warning: #f59e0b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --danger: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
            font-family: 'Outfit', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 12px;
            width: 100%;
            overflow-x: hidden;
        }

        .container {
            width: 100%;
            max-width: 440px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            margin-bottom: 40px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 2px;
        }

        h1 {
            font-size: 1.3rem;
            font-weight: 800;
            background: linear-gradient(135deg, #818cf8, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .stats-badge {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-muted);
        }

        .stats-badge span {
            color: var(--accent-success);
        }

        .progress-container {
            width: 100%;
            background: var(--card-border);
            height: 8px;
            border-radius: 4px;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, var(--accent-primary), #c084fc);
            width: 0%;
            transition: width 0.3s ease;
        }

        .puzzle-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            padding: 18px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
            width: 100%;
        }

        .puzzle-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .level-tag {
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--accent-primary);
            background: rgba(99, 102, 241, 0.1);
            padding: 4px 10px;
            border-radius: 8px;
        }

        .puzzle-title {
            font-size: 1.15rem;
            font-weight: 700;
            color: var(--text-main);
        }

        .puzzle-desc {
            font-size: 0.95rem;
            line-height: 1.5;
            color: var(--text-main);
            background: rgba(15, 23, 42, 0.5);
            padding: 14px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.03);
            word-break: break-word;
        }

        .hint-box {
            font-size: 0.85rem;
            color: var(--accent-warning);
            background: rgba(245, 158, 11, 0.1);
            border: 1px dashed rgba(245, 158, 11, 0.3);
            padding: 10px 14px;
            border-radius: 10px;
            display: none;
        }

        .hint-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            text-align: left;
            padding: 0;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 100%;
        }

        input[type="text"] {
            width: 100%;
            background: #0f172a;
            border: 2px solid var(--card-border);
            border-radius: 12px;
            padding: 14px 16px;
            color: var(--text-main);
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus {
            border-color: var(--accent-primary);
        }

        .btn {
            width: 100%;
            background: var(--accent-primary);
            color: white;
            border: none;
            border-radius: 12px;
            padding: 14px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 48px;
        }

        .btn:active {
            transform: scale(0.98);
        }

        .feedback {
            font-size: 0.9rem;
            font-weight: 600;
            text-align: center;
            min-height: 20px;
        }

        .feedback.correct {
            color: var(--accent-success);
        }

        .feedback.incorrect {
            color: var(--danger);
        }

        .nav-buttons {
            display: flex;
            gap: 10px;
            width: 100%;
        }

        .nav-btn {
            flex: 1;
            background: var(--card-border);
            color: var(--text-main);
            border: none;
            border-radius: 10px;
            padding: 12px;
            font-weight: 600;
            cursor: pointer;
            font-size: 0.85rem;
            min-height: 44px;
        }

        .reveal-section {
            border-top: 1px solid var(--card-border);
            padding-top: 14px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 100%;
        }

        .reveal-btn {
            background: transparent;
            border: 1px dashed var(--card-border);
            color: var(--text-muted);
            padding: 12px;
            border-radius: 10px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
        }

        .revealed-answer {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #fca5a5;
            padding: 12px;
            border-radius: 10px;
            font-size: 0.9rem;
            text-align: center;
            font-weight: 600;
            display: none;
        }

        .level-grid-toggle {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            color: var(--text-main);
            padding: 14px;
            border-radius: 14px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            min-height: 48px;
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(4px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s;
            padding: 16px;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-content {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            width: 100%;
            max-width: 400px;
            max-height: 75vh;
            border-radius: 20px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .close-modal {
            background: var(--card-border);
            border: none;
            color: var(--text-main);
            width: 36px;
            height: 36px;
            border-radius: 50%;
            font-weight: bold;
            font-size: 1.1rem;
            cursor: pointer;
        }

        .level-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 8px;
            overflow-y: auto;
            max-height: 50vh;
            padding: 4px;
        }

        .grid-cell {
            aspect-ratio: 1;
            background: #0f172a;
            border: 1px solid var(--card-border);
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--text-muted);
            cursor: pointer;
        }

        .grid-cell.solved {
            background: rgba(16, 185, 129, 0.15);
            border-color: var(--accent-success);
            color: var(--accent-success);
        }

        .grid-cell.current {
            border-color: var(--accent-primary);
            color: var(--accent-primary);
            background: rgba(99, 102, 241, 0.15);
        }

        .solved-banner {
            background: rgba(16, 185, 129, 0.15);
            border: 1px solid var(--accent-success);
            color: var(--accent-success);
            padding: 10px;
            border-radius: 10px;
            text-align: center;
            font-weight: 700;
            font-size: 0.9rem;
            display: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Brain Tester</h1>
            <div class="stats-badge">Solved: <span id="solvedCount">0</span>/1000</div>
        </header>

        <div class="progress-container">
            <div class="progress-bar" id="progressBar"></div>
        </div>

        <div class="puzzle-card">
            <div class="puzzle-header">
                <span class="level-tag" id="levelTag">Puzzle #1</span>
                <span id="categoryTag" style="font-size: 0.75rem; color: var(--text-muted);">Logic</span>
            </div>

            <h2 class="puzzle-title" id="puzzleTitle">The Missing Number</h2>
            <div class="puzzle-desc" id="puzzleDesc">Loading puzzle...</div>

            <button class="hint-btn" id="hintBtn" onclick="toggleHint()">💡 Tap for Hint</button>
            <div class="hint-box" id="hintBox"></div>

            <div class="solved-banner" id="solvedBanner">🎉 Puzzle Solved! Great job!</div>

            <div class="input-group" id="inputGroup">
                <input type="text" id="answerInput" placeholder="Type your answer..." autocomplete="off">
                <button class="btn" onclick="checkAnswer()">Submit Answer</button>
            </div>

            <div class="feedback" id="feedback"></div>

            <div class="nav-buttons">
                <button class="nav-btn" onclick="changeLevel(-1)">← Prev</button>
                <button class="nav-btn" onclick="changeLevel(1)">Next →</button>
            </div>

            <div class="reveal-section">
                <button class="reveal-btn" onclick="toggleReveal()">Reveal Answer (Give Up)</button>
                <div class="revealed-answer" id="revealedAnswerBox">Answer: <span id="revealText"></span></div>
            </div>
        </div>

        <button class="level-grid-toggle" onclick="toggleModal(true)">
            🗺️ View All 1000 Levels Map
        </button>
    </div>

    <!-- FIXED: Removed duplicate ID attribute so the modal map populates correctly -->
    <div class="modal-overlay" id="modalOverlay" onclick="handleModalClick(event)">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Choose Puzzle Level</h3>
                <button class="close-modal" onclick="toggleModal(false)">×</button>
            </div>
            <div class="level-grid" id="levelGrid"></div>
        </div>
    </div>

    <script>
        const elitePool = [
            { q: "A man pushes his car to a hotel and tells the owner he's bankrupt. Why?", a: "monopoly", hint: "Think of a famous board game.", cat: "Lateral Mystery", title: "The Bankrupt Driver" },
            { q: "Decrypt this Caesar shift (+1 cipher): 'Ifmmp' becomes 'Hello'. What does 'Uif' become?", a: "the", hint: "Shift each letter back by 1 in the alphabet (U->T, i->h, f->e).", cat: "Cipher", title: "Secret Cipher" },
            { q: "Complete the analogy: Finger is to Hand as Leaf is to...?", a: "branch", hint: "Part of a tree structure.", cat: "Analogy", title: "Natural Analogy" },
            { q: "I am an architectural feature. Remove my first letter and I become a crime. Remove my first two letters and I'm an animal. What am I?", a: "stair", hint: "Think about steps inside a house.", cat: "Wordplay", title: "Stairway Puzzle" },
            { q: "Two fathers and two sons went fishing. They caught 3 fish total, yet each person caught one fish. How is this possible?", a: "grandfather father son", hint: "Think about family generations (3 people total).", cat: "Paradox", title: "The Fishing Trip" },
            { q: "If you look at the digital clock and the time is 11:11, how many minutes until the next palindrome time?", a: "9", hint: "The next palindrome is 11:21.", cat: "Logic", title: "Palindrome Clock" },
            { q: "What unique English word has three consecutive double letters?", a: "bookkeeper", hint: "Associated with accounting and records (oo, kk, ee).", cat: "Lexicon", title: "Triple Double" },
            { q: "A clerk at a butcher shop stands 5 feet 10 inches tall and wears size 11 boots. What does he weigh?", a: "meat", hint: "What are his surroundings?", cat: "Riddle", title: "The Butcher's Scale" }
        ];

        const puzzles = [];
        for (let i = 0; i < 1000; i++) {
            if (i < elitePool.length) {
                puzzles.push(elitePool[i]);
            } else {
                const type = i % 10;
                const tier = i < 300 ? 1 : (i < 700 ? 2 : 3);

                if (type === 0) {
                    const cases = [
                        { q: `Case #${i+1}: A victim is found dead in a room with no windows and a locked door from the inside, hanging from a puddle of water. How did they reach the rope?`, a: "ice block", hint: "The support melted away over time.", cat: "Detective", title: `Cold Case #${i+1}` },
                        { q: `Case #${i+1}: A woman wears black to a daytime funeral, drives a black car, and lives in a street with all black streetlights. Yet, the street lamp was turned off and she still managed to cross safely without street lights or moonlight. Why?`, a: "daytime", hint: "Read the setup carefully—it's daytime!", cat: "Detective", title: `Observation Test #${i+1}` }
                    ];
                    puzzles.push(cases[i % cases.length]);
                } 
                else if (type === 1) {
                    const secretWords = ["matrix", "quantum", "cipher", "beacon", "eclipse", "zenith", "vortex", "nebula"];
                    const word = secretWords[i % secretWords.length];
                    const shift = (i % 3) + 1;
                    let encoded = "";
                    for (let c = 0; c < word.length; c++) {
                        encoded += String.fromCharCode(word.charCodeAt(c) + shift);
                    }
                    puzzles.push({
                        q: `Decode this cipher text shifted by +${shift}: "${encoded}". What is the original English word?`,
                        a: word,
                        hint: `Shift each letter backward by ${shift} in the alphabet.`,
                        cat: "Cryptogram",
                        title: `Secret Transmission #${i+1}`
                    });
                }
                else if (type === 2) {
                    const pairs = [
                        { a: "hot", b: "cold", target: "fast", ans: "slow" },
                        { a: "ocean", b: "water", target: "desert", ans: "sand" },
                        { a: "author", b: "book", target: "composer", ans: "song" },
                        { a: "needle", b: "thread", target: "lock", ans: "key" },
                        { a: "telescope", b: "stars", target: "microscope", ans: "cells" }
                    ];
                    const p = pairs[i % pairs.length];
                    puzzles.push({
                        q: `Semantic Analogy: '${p.a}' is to '${p.b}' as '${p.target}' is to what?`,
                        a: p.ans,
                        hint: `Find the relationship category between ${p.a} and ${p.b}.`,
                        cat: "Analogy",
                        title: `Relational Logic #${i+1}`
                    });
                }
                else if (type === 3) {
                    const steps = (i % 5) + 3;
                    puzzles.push({
                        q: `Spatial Tracking: You start facing North. You turn 90 degrees clockwise, walk ${steps} steps, turn 180 degrees, and walk ${steps - 1} steps forward. Which cardinal direction are you facing now?`,
                        a: "west",
                        hint: "Trace out each turn and step on a mental compass.",
                        cat: "Spatial",
                        title: `Navigation Matrix #${i+1}`
                    });
                }
                else if (type === 4) {
                    const itemsCount = (i % 4) + 3;
                    puzzles.push({
                        q: `Probability Trap: If you have a bag containing ${itemsCount} red socks and ${itemsCount} blue socks, what is the minimum number of socks you must pull out blindly to guarantee you have at least one matching pair?`,
                        a: "3", 
                        hint: "Think about the number of possible colors, not the total inventory.",
                        cat: "Probability",
                        title: `The Sock Paradox #${i+1}`
                    });
                }
                else if (type === 5) {
                    const chains = [
                        { q: "Change one letter at a time to transform 'CAT' into 'DOG'. What is the intermediate 3-letter word changing CAT to COT?", a: "cot", hint: "It's a small bed used for camping." },
                        { q: "What English word becomes plural by adding 'es', but becomes singular if you remove its last two letters?", a: "glasses", hint: "Worn on the face for vision or used for drinking." }
                    ];
                    const ch = chains[i % chains.length];
                    puzzles.push({
                        q: ch.q,
                        a: ch.a,
                        hint: ch.hint,
                        cat: "Word Chain",
                        title: `Linguistic Transformation #${i+1}`
                    });
                }
                else if (type === 6) {
                    let baseVal = (i % 10) + 3;
                    let mult = (i % 4) + 2;
                    puzzles.push({
                        q: `Matrix Code: If [A] = ${baseVal}, [B] = [A] * ${mult}, and [C] = [B] - ${baseVal}, what is the exact integer value of [C]?`,
                        a: String((baseVal * mult) - baseVal),
                        hint: `Step 1: Find [B] (${baseVal} * ${mult}). Step 2: Subtract ${baseVal}.`,
                        cat: "Advanced Logic",
                        title: `System Matrix #${i+1}`
                    });
                }
                else if (type === 7) {
                    const riddles = [
                        { q: "What can fill an entire room without taking up any physical space or weight?", a: "light", hint: "Turn on a switch and it fills the dark." },
                        { q: "I am born in deep oceans or mountains, yet I flow downward and can carve solid stone given enough time. What am I?", a: "water", hint: "Essential liquid flowing in rivers." },
                        { q: "What is completely yours, but everyone else uses it much more than you do?", a: "name", hint: "People call you by this every day." }
                    ];
                    const r = riddles[i % riddles.length];
                    puzzles.push({
                        q: r.q,
                        a: r.a,
                        hint: r.hint,
                        cat: "Lateral Riddle",
                        title: `Phenomenon #${i+1}`
                    });
                }
                else if (type === 8) {
                    const startH = (i % 6) + 1;
                    const addM = ((i % 3) + 1) * 15;
                    puzzles.push({
                        q: `Chronology: A train departs at ${startH}:00 and travels for ${addM} minutes. If it arrives precisely on schedule, what minute mark past the hour does it arrive?`,
                        a: String(addM),
                        hint: `The minutes past the hour equal the trip duration.`,
                        cat: "Chronology",
                        title: `Timetable #${i+1}`
                    });
                }
                else {
                    puzzles.push({
                        q: `Logical Deduction: Statement A is false. Statement B says 'Statement A is true'. Is Statement B true or false?`,
                        a: "false",
                        hint: "If A is false, then any claim that A is true must also be false.",
                        cat: "Deduction",
                        title: `Paradox Statement #${i+1}`
                    });
                }
            }
        }

        let currentLevel = parseInt(localStorage.getItem('brain_tester_level')) || 0;
        let solvedLevels = JSON.parse(localStorage.getItem('brain_tester_solved')) || [];

        const levelTag = document.getElementById('levelTag');
        const categoryTag = document.getElementById('categoryTag');
        const puzzleTitle = document.getElementById('puzzleTitle');
        const puzzleDesc = document.getElementById('puzzleDesc');
        const hintBox = document.getElementById('hintBox');
        const hintBtn = document.getElementById('hintBtn');
        const answerInput = document.getElementById('answerInput');
        const feedback = document.getElementById('feedback');
        const solvedCount = document.getElementById('solvedCount');
        const progressBar = document.getElementById('progressBar');
        const solvedBanner = document.getElementById('solvedBanner');
        const revealText = document.getElementById('revealText');
        const revealedAnswerBox = document.getElementById('revealedAnswerBox');

        function loadPuzzle() {
            const p = puzzles[currentLevel];
            levelTag.textContent = `Puzzle #${currentLevel + 1}`;
            categoryTag.textContent = p.cat;
            puzzleTitle.textContent = p.title;
            puzzleDesc.textContent = p.q;
            hintBox.textContent = p.hint;
            hintBox.style.display = 'none';
            hintBtn.style.display = 'flex';
            answerInput.value = '';
            feedback.textContent = '';
            feedback.className = 'feedback';
            revealText.textContent = p.a;
            revealedAnswerBox.style.display = 'none';

            if (solvedLevels.includes(currentLevel)) {
                solvedBanner.style.display = 'block';
            } else {
                solvedBanner.style.display = 'none';
            }

            updateStats();
            localStorage.setItem('brain_tester_level', currentLevel);
        }

        function toggleHint() {
            const isVisible = hintBox.style.display === 'block';
            hintBox.style.display = isVisible ? 'none' : 'block';
            hintBtn.style.display = isVisible ? 'flex' : 'none';
        }

        function toggleReveal() {
            revealedAnswerBox.style.display = revealedAnswerBox.style.display === 'block' ? 'none' : 'block';
        }

        function checkAnswer() {
            const userAns = answerInput.value.trim();
            const correctAns = puzzles[currentLevel].a;

            if (!userAns) {
                feedback.textContent = "Please enter an answer.";
                feedback.className = 'feedback incorrect';
                return;
            }

            const cleanUser = userAns.toLowerCase().replace(/^(a|an|the)\s+/, '').replace(/[^\w\s]/g, '').replace(/\s+/g, ' ').trim();
            const cleanCorrect = correctAns.toLowerCase().replace(/^(a|an|the)\s+/, '').replace(/[^\w\s]/g, '').replace(/\s+/g, ' ').trim();

            const userWords = cleanUser.split(' ');
            const correctWords = cleanCorrect.split(' ');

            let isMatch = (cleanUser === cleanCorrect);
            
            if (!isMatch && userWords.length > 0 && correctWords.length > 0) {
                const allWordsMatch = correctWords.every(w => userWords.includes(w)) && userWords.every(w => correctWords.includes(w));
                if (allWordsMatch) {
                    isMatch = true;
                }
            }

            if (isMatch) {
                feedback.textContent = "Correct! Brilliant deduction!";
                feedback.className = 'feedback correct';
                
                if (!solvedLevels.includes(currentLevel)) {
                    solvedLevels.push(currentLevel);
                    localStorage.setItem('brain_tester_solved', JSON.stringify(solvedLevels));
                }

                solvedBanner.style.display = 'block';

                setTimeout(() => {
                    if (currentLevel < 999) {
                        currentLevel++;
                        loadPuzzle();
                    } else {
                        loadPuzzle();
                    }
                }, 1200);
            } else {
                feedback.textContent = "Incorrect. Give it another thought!";
                feedback.className = 'feedback incorrect';
            }
            updateStats();
        }

        function changeLevel(dir) {
            currentLevel += dir;
            if (currentLevel < 0) currentLevel = 0;
            if (currentLevel > 999) currentLevel = 999;
            loadPuzzle();
        }

        function updateStats() {
            solvedCount.textContent = solvedLevels.length;
            const progress = (solvedLevels.length / 1000) * 100;
            progressBar.style.width = `${progress}%`;
        }

        answerInput.addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                checkAnswer();
            }
        });

        function toggleModal(open) {
            const overlay = document.getElementById('modalOverlay');
            if (open) {
                buildLevelGrid();
                overlay.classList.add('active');
            } else {
                overlay.classList.remove('active');
            }
        }

        function handleModalClick(e) {
            if (e.target.id === 'modalOverlay') {
                toggleModal(false);
            }
        }

        function buildLevelGrid() {
            const grid = document.getElementById('levelGrid');
            grid.innerHTML = '';
            for (let i = 0; i < 1000; i++) {
                const cell = document.createElement('div');
                cell.className = 'grid-cell';
                cell.textContent = i + 1;
                if (solvedLevels.includes(i)) cell.classList.add('solved');
                if (i === currentLevel) cell.classList.add('current');
                cell.onclick = () => {
                    currentLevel = i;
                    loadPuzzle();
                    toggleModal(false);
                };
                grid.appendChild(cell);
            }
        }

        loadPuzzle();
    </script>
</body>
</html>
